name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lol-coach-Backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r lol-coach-Backend/requirements.txt
          python -m pip install ruff pytest

      - name: Ruff
        run: python -m ruff check .
        continue-on-error: true

      - name: Pytest
        run: python -m pytestgit add .github/workflows/